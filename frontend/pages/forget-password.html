<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - ElectroFix</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/pages.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/custom.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold text-primary" href="/">
                <i class="fas fa-tools me-2"></i>ElectroFix
            </a>
            <div class="d-none d-lg-block">
                <a href="login.html" class="btn btn-outline-primary me-2">Login</a>
                <a href="register.html" class="btn btn-primary">Sign Up</a>
            </div>
        </div>
    </nav>

    <main class="container auth-hero">
        <div class="row w-100 justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card auth-card shadow-sm">
                    <div class="row g-0">
                        <div class="col-md-5 d-none d-md-flex align-items-center justify-content-center bg-light">
                            <div class="p-4 text-center">
                                <!-- Inline SVG illustration (keeps page lightweight and consistent) -->
                                <svg class="illustration" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                                    <rect x="2" y="5" width="20" height="14" rx="2" stroke="currentColor" stroke-width="1.5" fill="none"></rect>
                                    <path d="M3 7.5L12 13L21 7.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"></path>
                                    <path d="M7 16h10" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" fill="none"></path>
                                </svg>
                                <p class="mt-3 text-muted small">We'll send a secure link to your email</p>
                            </div>
                        </div>
                        <div class="col-md-7">
                            <div class="card-body p-4">
                                <h3 class="card-title mb-2">Reset Your Password</h3>
                                <p class="text-muted mb-4">Enter your account email and we'll send instructions to reset your password.</p>

                                <form id="forgot-password-form" class="mb-3">
                                    <div class="mb-3">
                                        <label for="reset-email" class="form-label">Email address</label>
                                        <input id="reset-email" type="email" class="form-control" placeholder="you@example.com" required>
                                    </div>
                                    <div class="d-grid mb-2">
                                        <button type="submit" class="btn btn-primary">Send Reset Link</button>
                                    </div>
                                    <div class="text-center">
                                        <a href="login.html">Back to login</a>
                                    </div>
                                </form>

                                <hr>
                                <div class="d-flex justify-content-between small text-muted">
                                    <div><i class="fas fa-clock me-1"></i>Quick process</div>
                                    <div><i class="fas fa-shield-alt me-1"></i>Secure</div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/main.js"></script>
    <script src="../js/auth.js"></script>
</body>
</html>
